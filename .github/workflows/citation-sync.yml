name: Update CITATION.cff on Tag
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-citation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: Adamtaranto/citation-sync-action@v1
        with:
          use-pull-request: true
          target-branch: develop
          token: ${{ secrets.GITHUB_TOKEN }}
